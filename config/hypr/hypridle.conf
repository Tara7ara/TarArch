general {
    lock_cmd             = /home/tara/.local/bin/hyprlock-launch.sh
    before_sleep_cmd     = /home/tara/.local/bin/hyprlock-launch.sh
    after_sleep_cmd      = hyprctl dispatch dpms on     # enciende pantalla al volver
    ignore_dbus_inhibit  = false
}

# REACTIVADO 2026-08-23: el "minuto de gracia" (grace-watch por evdev) se
# elimina del todo, no solo se arregla el bug del crash con el ratón — a
# petición explícita de Tara, da más dolores de cabeza que lo que aporta.
# Ahora bloqueo/suspensión automáticos piden contraseña siempre, igual que
# los manuales (Super+Alt+L, botón del menú) — sin distinción entre ambos.
listener {
    timeout    = 900                    # 15 min → bloquear pantalla (automático)
    on-timeout = loginctl lock-session
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 960                    # 16 min → apagar pantalla
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 1500                   # 25 min → suspender si el sistema está ocioso
    on-timeout = /home/tara/.local/bin/smart-suspend.sh
}
