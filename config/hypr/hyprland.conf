# Monitor
monitor=eDP-1, 1920x1080@144, 0x0, 1
monitor=HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, eDP-1

# Variables de entorno NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# Cursor (bibata-cursor-theme)
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

cursor {
    no_hardware_cursors = true
}

# Autostart
exec-once = awww-daemon
exec-once = awww img $HOME/img/wallpapers/arch_default.png --transition-type fade --transition-duration 0.4 --transition-fps 144 --filter Lanczos3
exec-once = ln -sf $HOME/img/wallpapers/arch_default.png $HOME/.cache/current_wallpaper_lock.png
exec-once = /home/tara/.local/bin/change-cursor.sh apply
exec-once = /home/tara/.local/bin/auto-battery-watcher.sh
exec-once = waybar
exec-once = /usr/lib/xfce-polkit/xfce-polkit
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = hyprlock --immediate-render
exec-once = swaync
exec-once = systemctl --user start swayosd.service
exec-once = /home/tara/.local/bin/lanmouse-autostart.sh
exec-once = python3 /home/tara/.local/bin/rdp-mode-watch.py
exec-once = /home/tara/.local/bin/notification-daemon.py

# Reglas de capas (layer-shell)
layerrule = blur true, match:namespace ^(swaync-control-center)$
layerrule = blur true, match:namespace ^(rofi)$

# Reglas de ventanas
windowrule = workspace 9, match:class ^(xfreerdp)$
windowrule = workspace special:minimized silent, match:class ^(rdp-console)$
windowrule = float true, match:class ^notarapida$
windowrule = size 700 480, match:class ^notarapida$
windowrule = center true, match:class ^notarapida$
windowrule = float true, match:class ^xfce-polkit$
windowrule = size 520 143, match:class ^xfce-polkit$
windowrule = center true, match:class ^xfce-polkit$
windowrule = float true, match:class ^(fsearch|io.github.cboxdoerfer.FSearch)$
windowrule = size 850 550, match:class ^(fsearch|io.github.cboxdoerfer.FSearch)$
windowrule = center true, match:class ^(fsearch|io.github.cboxdoerfer.FSearch)$
windowrule = float true, match:title ^(.*(Abrir archivo|Guardar como|Open File|Save As|Confirmar|Confirm|Elección de archivo|Sign in - Google Accounts|Iniciar sesión).*)$
windowrule = float true, match:class ^(xdg-desktop-portal.*|zenity|pavucontrol|blueman-manager)$

# Input
input {
    kb_layout = es
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Apariencia
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(ffffff18)
    col.inactive_border = rgba(ffffff08)
}

dwindle {
    preserve_split = yes   # no reordena el resto de ventanas al cerrar una
}

misc {
    vrr = 1   # VRR solo en pantalla completa
}

render {
    direct_scanout = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 2
        passes = 1
        new_optimizations = true
        xray = false
        noise = 0.0
        contrast = 1.15
        brightness = 0.60
        vibrancy = 0.10
        vibrancy_darkness = 0.10
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }
}

# Animaciones
bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
bezier = md3_accel, 0.3, 0.0, 0.8, 0.15

animations {
    enabled = yes

    # Ventanas
    animation = windows, 1, 2.5, md3_decel
    animation = windowsIn, 1, 2.5, md3_decel, popin 90%
    animation = windowsOut, 1, 2.0, md3_accel
    animation = windowsMove, 1, 2.5, md3_decel

    # Fades y capas (Waybar, menús, popups)
    animation = fade, 1, 2.2, md3_decel
    animation = fadeDim, 0
    animation = layers, 1, 2.5, md3_decel, slide

    # Escritorios
    animation = workspaces, 1, 3.8, md3_decel, slidefade 15%
    animation = specialWorkspace, 1, 3.5, md3_decel, slidevert

    # Bordes
    animation = border, 1, 4, default
}


# Modificador principal
$mainMod = SUPER

# Ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow
bind  = $mainMod, mouse:274, exec, /home/tara/.local/bin/workspace-picker.sh

# Aplicaciones
bind = $mainMod, Return, exec, kitty
bind = $mainMod, P, exec, ~/.local/bin/nota-rapida.sh
bind = $mainMod, E, exec, thunar
bind = $mainMod, Space, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi
bind = $mainMod, C, exec, /home/tara/.local/bin/control-center.py
bind = $mainMod, A, exec, /home/tara/.local/bin/show-keybindings.sh
bind = $mainMod, B, exec, /home/tara/.local/bin/bluetooth-menu.sh
bind = $mainMod, W, exec, wasistlos
bind = $mainMod, R, exec, /home/tara/.local/bin/ssh-launcher.sh
bind = $mainMod ALT, W, exec, /home/tara/.local/bin/wallpaper-picker.sh
bind = $mainMod ALT, C, exec, /home/tara/.local/bin/change-cursor.sh
bind = $mainMod ALT, P, exec, /home/tara/.local/bin/toggle-power-profile.sh

# Bloquear pantalla y apagado
bind = $mainMod ALT, L, exec, /home/tara/.local/bin/hyprlock-launch.sh
bind = $mainMod, X, exec, /home/tara/.local/bin/power-menu.sh

# Ventanas
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Space, exec, /home/tara/.local/bin/toggle-floating.sh
bind = $mainMod, G, exec, /home/tara/.local/bin/toggle-floating.sh
bind = $mainMod CTRL, M, exit
bind = $mainMod SHIFT, R, exec, hyprctl reload && notify-send "Hyprland" "Config recargado"
bind = $mainMod SHIFT, C, exec, /home/tara/.local/bin/compact-workspaces.sh

# Foco entre ventanas (Super + Ctrl + Flechas)
bind = $mainMod CTRL, left, movefocus, l
bind = $mainMod CTRL, right, movefocus, r
bind = $mainMod CTRL, up, movefocus, u
bind = $mainMod CTRL, down, movefocus, d

# Mover ventanas (Super + Ctrl + Shift + Flechas)
bind = $mainMod CTRL SHIFT, left, movewindow, l
bind = $mainMod CTRL SHIFT, right, movewindow, r
bind = $mainMod CTRL SHIFT, up, movewindow, u
bind = $mainMod CTRL SHIFT, down, movewindow, d

# Redimensionar ventanas (Super + Alt + Flechas)
bind = $mainMod ALT, left, resizeactive, -50 0
bind = $mainMod ALT, right, resizeactive, 50 0
bind = $mainMod ALT, up, resizeactive, 0 -50
bind = $mainMod ALT, down, resizeactive, 0 50

# Workspaces
bind = ALT, right, workspace, e+1
bind = ALT, left, workspace, e-1
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9

# Mover ventana a workspace
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9

# Volumen (con feedback visual OSD y respaldo directo en PipeWire)
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Música (l = funciona con pantalla bloqueada)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brillo (Fn+F7/F8 en el ROG con feedback OSD y respaldo directo)
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise || brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower || brightnessctl set 5%-

# Bloqueo de mayúsculas (Caps Lock OSD)
bind = , --release Caps_Lock, exec, swayosd-client --caps-lock

# LEDs teclado ROG: brillo (Super+Shift+flechas arriba/abajo)
bindel = $mainMod SHIFT, up, exec, sudo /home/tara/.local/bin/kbd-brightness.sh up
bindel = $mainMod SHIFT, down, exec, sudo /home/tara/.local/bin/kbd-brightness.sh down

# Screenshot
bind = , Print, exec, /home/tara/.local/bin/screenshot.sh
bind = $mainMod SHIFT, S, exec, /home/tara/.local/bin/screenshot.sh

# Desactivar la red (FN+F12)
bindl = , XF86RFKill, exec, sudo /usr/local/bin/toggle-network.sh

# VPN sola
bind = $mainMod, V, exec, /usr/local/bin/toggle-vpn.sh

# SSH rapido (NAS / Servidor)
bind = $mainMod, R, exec, /home/tara/.local/bin/ssh-launcher.sh

# Portapapeles (historial)
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -p "󰅍 " -theme ~/.config/rofi/clipboard.rasi | cliphist decode | wl-copy
bind = $mainMod CTRL, V,  exec, pkill -x wl-paste; rm -f "${XDG_CACHE_HOME:-$HOME/.cache}/cliphist/db"; wl-paste --watch cliphist store & notify-send "Portapapeles" "Historial reiniciado" -i edit-clear
# VPN + RDP a Windows 11 (FN+F10)
bind = , XF86TouchpadToggle, exec, kitty --class rdp-console --title "RDP Console" -e /home/tara/.local/bin/toggle-vpn-rdp.sh

# Modo RDP: rdp-mode-watch.py lo activa cuando xfreerdp tiene el foco.
# Se quedan en Hyprland SUPER+Q y ALT+números/flechas; Control_r para salir a mano.
submap = rdp
bind = , control_r, submap, reset
bind = , control_r, exec, /home/tara/.local/bin/rdp-mode.sh off
bind = $mainMod, Q, killactive
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT, right, workspace, e+1
bind = ALT, left, workspace, e-1
submap = reset

# Fondos de pantalla
bind = $mainMod, right, exec, /home/tara/.local/bin/wallpaper-cycle.sh next
bind = $mainMod, left, exec, /home/tara/.local/bin/wallpaper-cycle.sh prev

# Apps rápidas
bind = $mainMod, W, exec, wasistlos
bind = $mainMod, F, exec, firefox
bind = $mainMod, D, exec, discord
bind = $mainMod, S, exec, spotify-launcher
bind = $mainMod, O, exec, obsidian
bind = $mainMod, T, exec, telegram-desktop
bind = $mainMod, K, exec, keepassxc

# Pantalla completa
bind = $mainMod, F11, fullscreen, 0
bind = $mainMod SHIFT, F11, fullscreen, 1

# Ocultar/recuperar ventana (pseudo-minimizar)
bind = $mainMod SHIFT, N, movetoworkspace, special:minimized
bind = $mainMod, N, togglespecialworkspace, minimized
bind = $mainMod CTRL, N, movetoworkspace, previous

# Cambiar entre ventanas
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
