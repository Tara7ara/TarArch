general {
    hide_cursor = true
}

# =============================================================================
# ANIMACIONES CINEMÁTICAS (HYPRLOCK)
# =============================================================================
animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = quick, 0.15, 0, 0.1, 1

    # Animación de desbloqueo exitoso (transición fluida al escritorio)
    animation = fadeIn, 1, 3.0, easeOutQuint
    animation = fadeOut, 1, 2.5, md3_decel
    animation = inputFieldDots, 1, 2.2, md3_decel
    animation = inputFieldFade, 1, 2.8, easeOutQuint
    animation = inputFieldWidth, 1, 3.0, md3_decel
    animation = inputFieldColors, 1, 2.0, md3_decel
}

background {
    monitor      =
    path         = /home/tara/.cache/current_wallpaper_lock.png
    blur_size    = 8
    blur_passes  = 3
    brightness   = 0.55
}

# --- Hora grande en el centro (Blanco uniforme) ---
label {
    monitor       =
    text          = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size     = 96
    font_family   = JetBrainsMono Nerd Font Bold
    color         = rgba(255, 255, 255, 0.94)
    position      = 0, 115
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.50)
}

# --- Fecha debajo de la hora ---
label {
    monitor       =
    text          = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    font_size     = 18
    font_family   = JetBrainsMono Nerd Font Medium
    color         = rgba(255, 255, 255, 0.65)
    position      = 0, 30
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.40)
}

# --- Campo de contraseña interactivo y animado (Glass Capsule) ---
input-field {
    monitor           =
    size              = 280, 52
    outline_thickness = 2
    rounding          = -1
    dots_size         = 0.22
    dots_spacing      = 0.22
    dots_center       = true
    dots_rounding     = -1
    inner_color       = rgba(15, 15, 15, 0.72)
    outer_color       = rgba(255, 255, 255, 0.15) rgba(255, 158, 100, 0.35) 45deg
    font_color        = rgba(255, 255, 255, 0.95)
    fade_on_empty     = false
    placeholder_text  =
    check_color       = rgba(255, 158, 100, 0.85)
    fail_color        = rgba(255, 85, 85, 0.95)
    fail_text         =
    fail_timeout      = 500
    capslock_color    = rgba(246, 193, 119, 0.95)
    shadow_passes     = 2
    shadow_size       = 8
    shadow_color      = rgba(0, 0, 0, 0.50)
    position          = 0, -90
    halign            = center
    valign            = center
}

# --- Widget de música unificado (centrado, parte inferior) ---
label {
    monitor       =
    text          = cmd[update:1000] /home/tara/.local/bin/hyprlock-media.py
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    color         = rgba(255, 255, 255, 0.90)
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.50)
    position      = 0, 40
    halign        = center
    valign        = bottom
}


