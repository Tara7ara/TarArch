general {
    hide_cursor = true
}

# =============================================================================
# ANIMACIONES
# =============================================================================
animations {
    enabled = true
    bezier = md3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = fadeIn, 1, 3.0, easeOutQuint
    animation = fadeOut, 1, 2.5, md3_decel
    animation = inputFieldDots, 1, 2.2, md3_decel
    animation = inputFieldFade, 1, 2.8, easeOutQuint
    animation = inputFieldWidth, 1, 3.0, md3_decel
    animation = inputFieldColors, 1, 2.0, md3_decel
}

# Fondo actual desenfocado y oscurecido, para que el texto respire.
background {
    monitor     =
    path        = ~/.cache/current_wallpaper_lock.png
    blur_size   = 3
    blur_passes = 2
    brightness  = 0.55
    vibrancy    = 0.10
}

# Velo negro cálido encima del fondo: el desenfoque deja muchos fondos en gris
# azulado y así todo queda en la gama negro/naranja.
shape {
    monitor      =
    size         = 100%, 100%
    color        = rgba(15, 12, 10, 0.55)
    rounding     = 0
    border_size  = 0
    position     = 0, 0
    halign       = center
    valign       = center
    zindex       = -1
}

# --- Logo, el mismo del splash, ya escalado a 150 px (hyprlock lo pixela si lo reduce él) ---
image {
    monitor     =
    path        = ~/.config/hypr/icons/logo-lock.png
    size        = 150
    rounding    = 0
    border_size = 0
    position    = 0, 295
    halign      = center
    valign      = center
}

# --- Fecha: pequeña, en naranja y espaciada, como las cabeceras de los menús ---
label {
    monitor     =
    text        = cmd[update:60000] $HOME/.local/bin/hyprlock-info.py fecha
    font_size   = 11
    font_family = Inter SemiBold
    color       = rgba(255, 158, 100, 0.90)
    position    = 0, 175
    halign      = center
    valign      = center
}

# --- Hora ---
label {
    monitor       =
    text          = cmd[update:1000] date +"%H:%M"
    font_size     = 110
    font_family   = Inter Light
    color         = rgba(255, 255, 255, 0.95)
    position      = 0, 95
    halign        = center
    valign        = center
    shadow_passes = 2
    shadow_size   = 8
    shadow_color  = rgba(0, 0, 0, 0.35)
}

# --- Contraseña: barra recta y sin texto; naranja al escribir, rojo si falla ---
input-field {
    monitor           =
    size              = 300, 46
    outline_thickness = 1
    rounding          = 8
    dots_size         = 0.20
    dots_spacing      = 0.35
    dots_center       = true
    dots_rounding     = -1
    inner_color       = rgba(15, 15, 15, 0.85)
    outer_color       = rgba(45, 45, 45, 1.0)
    font_color        = rgba(255, 158, 100, 1.0)
    font_family       = Inter
    fade_on_empty     = false
    placeholder_text  =
    check_color       = rgba(255, 158, 100, 0.85)
    fail_color        = rgba(247, 118, 142, 0.95)
    fail_text         =
    fail_timeout      = 1500
    capslock_color    = rgba(224, 175, 104, 0.95)
    position          = 0, -40
    halign            = center
    valign            = center
}

# --- Próximo evento ---
label {
    monitor     =
    text        = cmd[update:30000] $HOME/.local/bin/hyprlock-info.py
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = 0, -100
    halign      = center
    valign      = center
}

# --- Clima (de caché; se refresca en segundo plano cada media hora) ---
label {
    monitor     =
    text        = cmd[update:600000] $HOME/.local/bin/hyprlock-info.py clima
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = 0, -128
    halign      = center
    valign      = center
}

# --- Música (solo si hay algo sonando) ---
label {
    monitor       =
    text          = cmd[update:1000] $HOME/.local/bin/hyprlock-media.py
    font_size     = 12
    font_family   = JetBrainsMono Nerd Font
    color         = rgba(255, 255, 255, 0.90)
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.50)
    position      = 0, 40
    halign        = center
    valign        = bottom
}
