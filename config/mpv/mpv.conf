# ==============================================================================
# Configuración mpv - Comportamiento de Galería
# ==============================================================================

# Se queda congelado en el último fotograma como una foto (no se cierra solo)
keep-open=yes
loop-playlist=inf

# Ajuste visual e integración
autofit-larger=90%x90%
vo=gpu
hwdec=auto-safe
cursor-autohide=1000

# Información en pantalla
osd-font-size=24
osd-duration=1500
