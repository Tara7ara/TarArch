# ==============================================================================
# Atajos de teclado mpv - Modo Galería de Fotos / Vídeos
# ==============================================================================

# Cambiar de vídeo con las flechas como si fuera un visor de fotos:
RIGHT        playlist-next
LEFT         playlist-prev
ENTER        playlist-next
PGDWN        playlist-next
PGUP         playlist-prev
WHEEL_DOWN   playlist-next
WHEEL_UP     playlist-prev

# Volver a reproducir el vídeo actual desde el principio:
r            seek 0 absolute ; set pause no

# Buscar dentro del vídeo actual con Shift o Ctrl:
Shift+RIGHT  seek 5
Shift+LEFT   seek -5
Ctrl+RIGHT   seek 30
Ctrl+LEFT    seek -30

# Pausar / Reanudar:
SPACE        cycle pause

# Volumen:
UP           add volume 5
DOWN         add volume -5
