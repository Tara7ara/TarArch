[dmenu]
dmenu_command = rofi -dmenu -i -theme ~/.config/rofi/wifi.rasi
active_chars = ==
highlight = True
compact = False
wifi_chars = ▂▄▆█
format = {name:<{max_len_name}s}  {sec:<{max_len_sec}s}  {bars:>4}
list_saved = False
prompt = Redes

[dmenu_passphrase]
obscure = False

[pinentry]
description = Contraseña de la red
prompt = Contraseña:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
