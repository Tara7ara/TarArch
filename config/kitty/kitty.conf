# Tokyo Night (warm — sin azules)
background            #0f0f0f
foreground            #c9c9c9
selection_background  #2d2d2d
selection_foreground  #ffffff
cursor                #ff9e64
cursor_text_color     #0f0f0f

# Colores ANSI (remapeados a paleta warm con 16 colores reales)
color0   #2d2d2d
color1   #e05f78
color2   #9ece6a
color3   #e0af68
color4   #ff9e64
color5   #9d7cd8
color6   #b5a07a
color7   #c9c9c9

# Colores Bright
color8   #6e6e6e
color9   #ff7a93
color10  #b9f27c
color11  #ffc777
color12  #ffb88c
color13  #c099ff
color14  #d6c4a0
color15  #ffffff

shell /bin/zsh
shell_integration enabled

# Pestañas: texto plano, la activa en naranja y las demás en gris
# (mismo criterio que las pestañas del lanzador y del Centro de Control)
tab_bar_style              separator
tab_separator              "    "
tab_bar_edge               top
tab_bar_min_tabs           2
tab_bar_margin_height      4 2
tab_bar_margin_width       10
tab_title_max_length       28
tab_title_template         "{index}  {title}"
active_tab_foreground      #ff9e64
active_tab_background      #0f0f0f
active_tab_font_style      normal
inactive_tab_foreground    #6e6e6e
inactive_tab_background    #0f0f0f
inactive_tab_font_style    normal
tab_bar_background         #0f0f0f

# Fuente
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Transparencia equilibrada (cristal ahumado con blur sutil de Hyprland)
background_opacity 0.65

# Sin bordes, aspecto limpio
hide_window_decorations yes
window_padding_width 10

# No recordar tamano/estado de ventana: en tiling lo controla Hyprland.
# (kitty 0.49 empezo a restaurar "maximized" y las terminales salian a pantalla completa)
remember_window_size no

# Atajos de Portapapeles, Pestañas y Splits
map ctrl+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+backspace send_text all \x17

# Selección estilo PuTTY y permisos de portapapeles OSC 52
copy_on_select yes
clipboard_control write-clipboard write-primary read-clipboard read-primary
mouse_map right click ungrabbed paste_from_selection

# Desactivar campanas y notificaciones de terminal
enable_audio_bell no
window_alert_on_bell no
notify_on_cmd_finish never
